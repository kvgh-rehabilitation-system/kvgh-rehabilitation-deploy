x-backend-dev: &backend-dev
  environment:
    KVGH_APP_DEBUG: "1"
    KVGH_CORS_ALLOW_CREDENTIALS: "true"
    KVGH_CORS_ALLOWED_ORIGINS: ${KVGH_CORS_ALLOWED_ORIGINS:-http://localhost:2000,http://127.0.0.1:2000}
  volumes:
    - ./backend-fastapi:/app
    - ./backend-fastapi/config/settings.compose.yaml:/app/config/settings.yaml:ro
    - ${ANALYSIS_BASE_ROOT:-.}/physiotherapy_vghks:/opt/kvgh-rehabilitation-system/physiotherapy_vghks
    - backend_temp:/data/tmp_videos

services:
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "2000"]
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      VITE_BACKEND_ORIGIN: ${VITE_BACKEND_ORIGIN:-http://backend-api:8000}
    ports:
      - "${FRONTEND_DEV_PORT:-2000}:2000"
    volumes:
      - ./frontend-react:/app
      - frontend_node_modules:/app/node_modules

  backend-api:
    <<: *backend-dev
    command: ["python", "-m", "uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker-video:
    <<: *backend-dev

  worker-script:
    <<: *backend-dev

  worker-annotation:
    <<: *backend-dev

  worker-metrics:
    <<: *backend-dev
    environment:
      KVGH_APP_DEBUG: "1"
      KVGH_CORS_ALLOW_CREDENTIALS: "true"
      KVGH_CORS_ALLOWED_ORIGINS: ${KVGH_CORS_ALLOWED_ORIGINS:-http://localhost:2000,http://127.0.0.1:2000}
      KVGH_NODE_NAME: ${KVGH_DEV_NODE_NAME:-docker-dev-node}
      BACKEND_GIT_SHA: ${BACKEND_GIT_SHA:-local}
      BACKEND_GIT_REF: ${BACKEND_GIT_REF:-local}
      BACKEND_BUILD_AT: ${BACKEND_BUILD_AT:-local}

  worker-metrics-dispatch:
    <<: *backend-dev

  beat:
    <<: *backend-dev
