name: kvgh-rehabilitation-system

x-backend-common: &backend-common
  build:
    context: ./backend-fastapi
    dockerfile: Dockerfile
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      BACKEND_GIT_SHA: ${BACKEND_GIT_SHA:-local}
      BACKEND_GIT_REF: ${BACKEND_GIT_REF:-local}
      BACKEND_BUILD_AT: ${BACKEND_BUILD_AT:-local}
  working_dir: /app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment:
    PYTHONUNBUFFERED: "1"
    KVGH_AUTH_SECRET_KEY: ${KVGH_AUTH_SECRET_KEY}
    KVGH_DATABASE_URL: ${KVGH_DATABASE_URL}
    KVGH_CELERY_BROKER_URL: ${KVGH_CELERY_BROKER_URL}
    KVGH_CELERY_RESULT_BACKEND: ${KVGH_CELERY_RESULT_BACKEND:-rpc://}
    KVGH_SESSION_COOKIE_DOMAIN: ${KVGH_SESSION_COOKIE_DOMAIN:-}
    KVGH_SESSION_COOKIE_SAMESITE: ${KVGH_SESSION_COOKIE_SAMESITE:-lax}
    KVGH_SESSION_COOKIE_SECURE: ${KVGH_SESSION_COOKIE_SECURE:-}
    KVGH_CORS_ALLOW_CREDENTIALS: ${KVGH_CORS_ALLOW_CREDENTIALS:-true}
    KVGH_CORS_ALLOWED_ORIGINS: ${KVGH_CORS_ALLOWED_ORIGINS:-}
    METRICS_QUEUE_PREFIX: ${METRICS_QUEUE_PREFIX:-gpu_metrics}
    METRICS_DISPATCH_QUEUE: ${METRICS_DISPATCH_QUEUE:-gpu_metrics_dispatch}
    BACKEND_GIT_SHA: ${BACKEND_GIT_SHA:-local}
    BACKEND_GIT_REF: ${BACKEND_GIT_REF:-local}
    BACKEND_BUILD_AT: ${BACKEND_BUILD_AT:-local}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ciot_db}
      POSTGRES_USER: ${POSTGRES_USER:-ciot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ciot} -d ${POSTGRES_DB:-ciot_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2.5-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ciot_borker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change_me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-KVGH_reha_vhost}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-api:
    <<: *backend-common
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker-video:
    <<: *backend-common
    command:
      - bash
      - -lc
      - python -m celery -A app.celery_app.celery_app worker --autoscale=${VIDEO_AUTOSCALE_MAX:-4},${VIDEO_AUTOSCALE_MIN:-2} -Q video_transcode -n video_worker@%h -l info

  worker-script:
    <<: *backend-common
    command:
      - bash
      - -lc
      - python -m celery -A app.celery_app.celery_app worker --autoscale=${SCRIPT_AUTOSCALE_MAX:-2},${SCRIPT_AUTOSCALE_MIN:-1} -Q script_executor_waiting,script_executor -n script_worker@%h -l info
    environment:
      PYTHONUNBUFFERED: "1"
      KVGH_AUTH_SECRET_KEY: ${KVGH_AUTH_SECRET_KEY}
      KVGH_DATABASE_URL: ${KVGH_DATABASE_URL}
      KVGH_CELERY_BROKER_URL: ${KVGH_CELERY_BROKER_URL}
      KVGH_CELERY_RESULT_BACKEND: ${KVGH_CELERY_RESULT_BACKEND:-rpc://}
      KVGH_SESSION_COOKIE_DOMAIN: ${KVGH_SESSION_COOKIE_DOMAIN:-}
      KVGH_SESSION_COOKIE_SAMESITE: ${KVGH_SESSION_COOKIE_SAMESITE:-lax}
      KVGH_SESSION_COOKIE_SECURE: ${KVGH_SESSION_COOKIE_SECURE:-}
      KVGH_CORS_ALLOW_CREDENTIALS: ${KVGH_CORS_ALLOW_CREDENTIALS:-true}
      KVGH_CORS_ALLOWED_ORIGINS: ${KVGH_CORS_ALLOWED_ORIGINS:-}
      METRICS_QUEUE_PREFIX: ${METRICS_QUEUE_PREFIX:-gpu_metrics}
      METRICS_DISPATCH_QUEUE: ${METRICS_DISPATCH_QUEUE:-gpu_metrics_dispatch}
      BACKEND_GIT_SHA: ${BACKEND_GIT_SHA:-local}
      BACKEND_GIT_REF: ${BACKEND_GIT_REF:-local}
      BACKEND_BUILD_AT: ${BACKEND_BUILD_AT:-local}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility,video}
    gpus: all

  worker-annotation:
    <<: *backend-common
    command:
      - bash
      - -lc
      - python -m celery -A app.celery_app.celery_app worker --autoscale=${ANNOTATION_AUTOSCALE_MAX:-8},${ANNOTATION_AUTOSCALE_MIN:-1} -Q annotation -n annotation_worker@%h -l info

  worker-metrics:
    <<: *backend-common
    command:
      - bash
      - -lc
      - python -m celery -A app.celery_app.celery_app worker --concurrency=1 -Q $${METRICS_QUEUE_PREFIX:-gpu_metrics}.$${KVGH_NODE_NAME:-docker-node} -n metrics_worker@%h -l info
    environment:
      PYTHONUNBUFFERED: "1"
      KVGH_AUTH_SECRET_KEY: ${KVGH_AUTH_SECRET_KEY}
      KVGH_DATABASE_URL: ${KVGH_DATABASE_URL}
      KVGH_CELERY_BROKER_URL: ${KVGH_CELERY_BROKER_URL}
      KVGH_CELERY_RESULT_BACKEND: ${KVGH_CELERY_RESULT_BACKEND:-rpc://}
      KVGH_SESSION_COOKIE_DOMAIN: ${KVGH_SESSION_COOKIE_DOMAIN:-}
      KVGH_SESSION_COOKIE_SAMESITE: ${KVGH_SESSION_COOKIE_SAMESITE:-lax}
      KVGH_SESSION_COOKIE_SECURE: ${KVGH_SESSION_COOKIE_SECURE:-}
      KVGH_CORS_ALLOW_CREDENTIALS: ${KVGH_CORS_ALLOW_CREDENTIALS:-true}
      KVGH_CORS_ALLOWED_ORIGINS: ${KVGH_CORS_ALLOWED_ORIGINS:-}
      METRICS_QUEUE_PREFIX: ${METRICS_QUEUE_PREFIX:-gpu_metrics}
      METRICS_DISPATCH_QUEUE: ${METRICS_DISPATCH_QUEUE:-gpu_metrics_dispatch}
      KVGH_NODE_NAME: ${KVGH_NODE_NAME:-docker-node}
      BACKEND_GIT_SHA: ${BACKEND_GIT_SHA:-local}
      BACKEND_GIT_REF: ${BACKEND_GIT_REF:-local}
      BACKEND_BUILD_AT: ${BACKEND_BUILD_AT:-local}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    gpus: all

  worker-metrics-dispatch:
    <<: *backend-common
    command:
      - bash
      - -lc
      - python -m celery -A app.celery_app.celery_app worker --concurrency=1 -Q $${METRICS_DISPATCH_QUEUE:-gpu_metrics_dispatch} -n metrics_dispatch_worker@%h -l info

  beat:
    <<: *backend-common
    command: ["python", "-m", "celery", "-A", "app.celery_app.celery_app", "beat", "-l", "info"]

volumes:
  postgres_data:
  rabbitmq_data:
  backend_temp:
  frontend_node_modules:
